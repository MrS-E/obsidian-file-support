name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Package plugin
        run: npm run package:plugin

      - name: Compress plugin directory
        run: |
          cd dist
          zip -r obsidian-file-support.zip obsidian-file-support

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/obsidian-file-support.zip
            dist/obsidian-file-support/main.js
            dist/obsidian-file-support/manifest.json
            dist/obsidian-file-support/styles.css
          generate_release_notes: true
